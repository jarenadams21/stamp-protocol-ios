name: iOS

# Pull request gate (about 8 minutes), in two parallel jobs:
#   - the shard coverage check, the Xcode project check, the build, and unit tests
#   - a build and the UI smoke tests (apps/ios/JOEYYUITests/smoke.txt)
# The full UI suite runs after merge, in post-merge.yml (UI failures are reported, not reverted).
on:
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/ios.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  check:
    name: Project check, build, unit tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Every UI test is in exactly one shard; CI script tests
        run: |
          node ../../.github/scripts/ui-tests.mjs check
          node --test ../../.github/scripts/ci-scripts.test.mjs
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        id: xcodegen
        with:
          path: ~/xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}-${{ runner.os }}
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        if: steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d ~/xcodegen
      - name: Check the committed Xcode project matches project.yml
        run: |
          XCODEGEN=$(find ~/xcodegen -type f -name xcodegen -perm -u+x | head -1)
          "$XCODEGEN" --version
          "$XCODEGEN" generate
          if ! git diff --quiet -- JOEYY.xcodeproj; then
            git --no-pager diff --stat -- JOEYY.xcodeproj
            echo "::error::JOEYY.xcodeproj is out of date. Run 'xcodegen generate' and commit the result, or download the xcodeproj artifact from this run."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodeproj
          path: apps/ios/JOEYY.xcodeproj/project.pbxproj
      - name: Build for testing (simulator boots in parallel)
        id: build
        run: bash ../../.github/scripts/ios-build.sh
      - name: Unit tests
        env:
          UDID: ${{ steps.build.outputs.udid }}
        run: bash ../../.github/scripts/ios-test.sh unit-tests unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-logs
          path: |
            apps/ios/build.log
            apps/ios/results/*.log
            apps/ios/results/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult-unit-tests
          path: apps/ios/results/*.xcresult
          if-no-files-found: ignore

  smoke:
    name: UI smoke tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for testing (simulator boots in parallel)
        id: build
        run: bash ../../.github/scripts/ios-build.sh
      - name: UI smoke tests
        env:
          UDID: ${{ steps.build.outputs.udid }}
        run: bash ../../.github/scripts/ios-test.sh ui-smoke smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-logs
          path: |
            apps/ios/build.log
            apps/ios/results/*.log
            apps/ios/results/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult-ui-smoke
          path: apps/ios/results/*.xcresult
          if-no-files-found: ignore
