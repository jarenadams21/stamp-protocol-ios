name: iOS

# Fast path (every qualifying push and pull request): the Xcode project drift check, the build,
# and unit tests. UI tests are slow, so they run only on pull requests into main, nightly, and
# on manual runs (unless ui_tests is turned off).
on:
  push:
    branches: [main]
    paths:
      - JOEYY/**
      - JOEYYTests/**
      - JOEYYUITests/**
      - project.yml
      - JOEYY.xcodeproj/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - JOEYY/**
      - JOEYYTests/**
      - JOEYYUITests/**
      - project.yml
      - JOEYY.xcodeproj/**
      - .github/workflows/ios.yml
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      ui_tests:
        description: Also run the UI tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check the committed Xcode project matches project.yml
        run: |
          brew install xcodegen
          xcodegen generate
          if ! git diff --quiet -- JOEYY.xcodeproj; then
            git --no-pager diff --stat -- JOEYY.xcodeproj
            echo "::error::JOEYY.xcodeproj is out of date. Run 'xcodegen generate' and commit the result, or download the xcodeproj artifact from this run."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodeproj
          path: JOEYY.xcodeproj/project.pbxproj
      - name: Choose an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
      - name: Build for testing
        run: |
          set +e
          xcodebuild build-for-testing -project JOEYY.xcodeproj -scheme JOEYY \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*(Swift 6|concurren|Sendable)|\*\* " build.log | head -80
          exit $status
      - name: Unit tests
        run: |
          set +e
          xcodebuild test-without-building -project JOEYY.xcodeproj -scheme JOEYY \
            -destination "id=${{ steps.simulator.outputs.udid }}" -derivedDataPath DerivedData \
            -only-testing:JOEYYTests -resultBundlePath UnitTests.xcresult > unit.log 2>&1
          status=$?
          grep -E "error:|Test Case .* failed|Executed|\*\* TEST" unit.log | tail -60
          exit $status
      - name: UI tests
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'workflow_dispatch' && inputs.ui_tests)
        run: |
          set +e
          # Simulator UI tests can hit runner hiccups; a test passes only if it passes on a rerun.
          xcodebuild test-without-building -project JOEYY.xcodeproj -scheme JOEYY \
            -destination "id=${{ steps.simulator.outputs.udid }}" -derivedDataPath DerivedData \
            -only-testing:JOEYYUITests \
            -resultBundlePath UITests.xcresult > ui.log 2>&1
          status=$?
          grep -E "error:|Test Case .* failed|Executed|\*\* TEST" ui.log | tail -120
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            UnitTests.xcresult
            UITests.xcresult
            *.log
