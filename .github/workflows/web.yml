name: Web

# The diner's web page (apps/web/): every change must type-check and build in both modes.
# Runs on pull requests; after merge, post-merge.yml calls it with the merged commit.
on:
  pull_request:
    paths: [apps/web/**, .github/workflows/web.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      report:
        description: Upload a result for the post-merge verdict
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Only pull request runs share a group; post-merge calls must never cancel each other.
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        id: install
      - run: npm run typecheck
      - run: npm run build:demo
      - name: Prod build (placeholder API address)
        run: npm run build
        env:
          VITE_API_BASE: https://api.example.test
      - name: Prod bundle has no demo code
        run: |
          if grep -l "Preview states\|Norema" dist/assets/*.js; then
            echo "Demo code found in the production bundle" && exit 1
          fi
      # A failing type-check or build after a clean install is a real failure (post-merge rolls back);
      # a failed checkout or `npm ci` is a setup error (notifies only).
      - name: Report the result
        if: always() && inputs.report
        env:
          STATUS: ${{ steps.install.outcome != 'success' && 'error' || job.status == 'success' && 'passed' || 'failed' }}
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          BROKEN="[]"
          if [ "$STATUS" = failed ]; then
            BROKEN='[{"test":"apps/web: type-check and build","message":"see the Web job log"}]'
          fi
          echo "{\"suite\":\"web-build\",\"status\":\"$STATUS\",\"broken\":$BROKEN,\"flaky\":[],\"infra\":[],\"missing\":[]}" \
            > "$RUNNER_TEMP/results/web-build.json"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.report
        with:
          name: results-web
          path: ${{ runner.temp }}/results/web-build.json
