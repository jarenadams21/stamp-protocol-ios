name: Release

# Tag pushes (v*) publish a GitHub release, and only from a commit that passed post-merge validation
# (the `verified` tag marks the latest one). Manual runs (Run workflow) and pull requests that change
# this workflow are a dry run: they build and package the IPA and upload it as an artifact, without
# publishing anything.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

jobs:
  release:
    name: Publish sideloadable IPA
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      IPA_NAME: ${{ github.event_name == 'push' && format('JOEYY-{0}', github.ref_name) || format('JOEYY-dry-run-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - name: Release only a verified commit
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
            --jq '[.statuses[] | select(.context == "Post-merge validation")][0].state // "missing"')
          if [ "$STATE" != "success" ]; then
            echo "::error::$GITHUB_SHA has no passing post-merge validation ($STATE). Tag a verified commit, such as the one the 'verified' tag points to."
            exit 1
          fi
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build unsigned app
        run: |
          set +e
          VERSION_SETTINGS=()
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION_SETTINGS=(MARKETING_VERSION="${GITHUB_REF_NAME#v}")
          fi
          xcodebuild build -project JOEYY.xcodeproj -scheme JOEYY \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build \
            "${VERSION_SETTINGS[@]}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > release-build.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD" release-build.log | tail -100
          exit $status
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JOEYY.app Payload/
          zip -qry "$IPA_NAME.ipa" Payload
          ls -lh "$IPA_NAME.ipa"
      - name: Upload IPA (dry run)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: apps/ios/${{ env.IPA_NAME }}.ipa
      - name: Create GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Unsigned build of JOEYY ${GITHUB_REF_NAME} (customer and business sides) for sideloading. Uses sample data only.

          ## Install on iPhone
          1. Download \`JOEYY-${GITHUB_REF_NAME}.ipa\` below.
          2. Open [Sideloadly](https://sideloadly.io) on your computer, connect your iPhone, drag in the IPA, and sign in with your Apple ID.
          3. On iPhone, trust the developer profile in **Settings > General > VPN & Device Management**, and turn on **Developer Mode** if prompted.

          With a free Apple ID, sideloaded apps expire after 7 days; reinstall to refresh.
          EOF
          gh release create "$GITHUB_REF_NAME" "JOEYY-${GITHUB_REF_NAME}.ipa" \
            --title "JOEYY ${GITHUB_REF_NAME}" --notes-file release-notes.md --prerelease
