name: JOEYY
options:
  bundleIdPrefix: com.joeyy
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  JOEYY:
    type: application
    platform: iOS
    sources: [JOEYY]
    attributes:
      SystemCapabilities:
        com.apple.NearFieldCommunicationTagReading:
          enabled: 1
        com.apple.Wallet:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeyy.customer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: JOEYY/App/JOEYY.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: JOEYY/App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: JOEYY
        INFOPLIST_KEY_NFCReaderUsageDescription: Scan a cafe loyalty tag to securely verify your visit and update your card.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1.0"
        # Build 4 was the last TestFlight upload before the monorepo; never go back below it.
        CURRENT_PROJECT_VERSION: 4
      # Where the app reaches the API (AppConfiguration.apiBaseURL). Release builds, the IPA for
      # sideloading, use the hosted dev API; release.yml can override it with the repository
      # variable JOEYY_API_BASE_URL. The apiBaseURL user default overrides both.
      configs:
        Debug:
          JOEYY_API_BASE_URL: http://localhost:8080
        Release:
          JOEYY_API_BASE_URL: https://joeyy-api-node.happycoast-32e2d60b.westus.azurecontainerapps.io
  JOEYYTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JOEYYTests]
    dependencies:
      - target: JOEYY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  JOEYYUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JOEYYUITests
        # shards.txt, smoke.txt, and quarantine.txt are CI test plans, not bundle resources.
        excludes: ["*.txt"]
    dependencies:
      - target: JOEYY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JOEYY:
    build:
      targets:
        JOEYY: all
    test:
      targets: [JOEYYTests, JOEYYUITests]
