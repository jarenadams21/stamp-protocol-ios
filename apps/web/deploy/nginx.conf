# One address for the page and the API: /v1 goes to the API container on localhost:8080 (same
# container app), everything else is the single-page app.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /v1/ {
    proxy_pass http://127.0.0.1:8080;
    # The API checks a write's Origin against the Host it sees, so pass the public one through.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
