name: JOEYY
options:
  bundleIdPrefix: com.joeyy
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  JOEYY:
    type: application
    platform: iOS
    sources: [JOEYY]
    info:
      path: JOEYY/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LoyaltyAPIBaseURL: $(LOYALTY_API_BASE_URL)
        LoyaltyPrototypeMode: $(LOYALTY_PROTOTYPE_MODE)
        ITSAppUsesNonExemptEncryption: false
    attributes:
      SystemCapabilities:
        com.apple.NearFieldCommunicationTagReading:
          enabled: 1
        com.apple.Wallet:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeyy.customer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JOEYY
        INFOPLIST_KEY_NFCReaderUsageDescription: Scan a cafe loyalty tag to securely verify your visit and update your card.
        CODE_SIGN_ENTITLEMENTS: JOEYY/JOEYY.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
  JOEYYTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JOEYYTests]
    dependencies:
      - target: JOEYY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  JOEYYUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JOEYYUITests]
    dependencies:
      - target: JOEYY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JOEYY:
    build:
      targets:
        JOEYY: all
    test:
      targets: [JOEYYTests, JOEYYUITests]
