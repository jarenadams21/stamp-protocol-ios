name: JOEYY
options:
  bundleIdPrefix: com.joeyy
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  JOEYY:
    type: application
    platform: iOS
    sources: [JOEYY]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeyy.customer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JOEYY
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
  JOEYYTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JOEYYTests]
    dependencies:
      - target: JOEYY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  JOEYYUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JOEYYUITests]
    dependencies:
      - target: JOEYY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JOEYY:
    build:
      targets:
        JOEYY: all
    test:
      targets: [JOEYYTests, JOEYYUITests]
